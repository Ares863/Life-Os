<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Life OS — Dashboard pessoal de finanças, rotina e saúde.">
  <meta name="theme-color" content="#6366f1">
  <title>Life OS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Navegação principal">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L2 7l10 5 10-5-10-5z" />
              <path d="M2 17l10 5 10-5" />
              <path d="M2 12l10 5 10-5" />
            </svg>
          </span>
          <span class="brand-name">Life OS</span>
        </div>
        <button class="sidebar-close" id="sidebarClose" aria-label="Fechar menu">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
      </div>

      <nav class="sidebar-nav" id="mainNav">
        <a href="#" class="nav-item active" data-view="overview">
          <span class="nav-icon">🏠</span><span class="nav-label">Visão geral</span>
        </a>
        <a href="#" class="nav-item" data-view="finances">
          <span class="nav-icon">💰</span><span class="nav-label">Finanças</span>
        </a>
        <a href="#" class="nav-item" data-view="routine">
          <span class="nav-icon">📋</span><span class="nav-label">Rotina</span>
        </a>
        <a href="#" class="nav-item" data-view="tasks">
          <span class="nav-icon">✅</span><span class="nav-label">Tarefas</span>
        </a>
        <a href="#" class="nav-item" data-view="workout">
          <span class="nav-icon">🏋️</span><span class="nav-label">Treino</span>
        </a>
        <a href="#" class="nav-item" data-view="diet">
          <span class="nav-icon">🥗</span><span class="nav-label">Dieta</span>
        </a>
        <a href="#" class="nav-item" data-view="goals">
          <span class="nav-icon">🎯</span><span class="nav-label">Metas</span>
        </a>
        <a href="#" class="nav-item" data-view="reports">
          <span class="nav-icon">📊</span><span class="nav-label">Relatórios</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <a href="#" class="nav-item" data-view="settings">
          <span class="nav-icon">⚙️</span><span class="nav-label">Configurações</span>
        </a>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="hamburger" id="hamburger" aria-label="Abrir menu">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round">
              <path d="M3 6h18M3 12h18M3 18h18" />
            </svg>
          </button>
          <span class="topbar-page-title" id="pageTitle">Visão geral</span>
        </div>
        <div class="topbar-right">
          <button class="icon-btn" id="themeToggle" aria-label="Alternar tema escuro ou claro" title="Alternar tema">
            <svg id="iconSun" class="theme-icon" viewBox="0 0 24 24" width="20" height="20" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <svg id="iconMoon" class="theme-icon hidden" viewBox="0 0 24 24" width="20" height="20" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
          </button>
        </div>
      </header>

      <!-- Views -->
      <section class="view active" id="view-overview" aria-label="Visão geral"></section>
      <section class="view" id="view-finances" aria-label="Finanças"></section>
      <section class="view" id="view-routine" aria-label="Rotina"></section>
      <section class="view" id="view-tasks" aria-label="Tarefas"></section>
      <section class="view" id="view-workout" aria-label="Treino"></section>
      <section class="view" id="view-diet" aria-label="Dieta"></section>
      <section class="view" id="view-goals" aria-label="Metas"></section>
      <section class="view" id="view-reports" aria-label="Relatórios"></section>
      <section class="view" id="view-settings" aria-label="Configurações"></section>
    </main>
  </div>

  <!-- Modal container -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" id="modalBox" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle"></h3>
        <button class="modal-close" id="modalClose" aria-label="Fechar">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <!-- Toasts -->
  <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <!-- Confirm dialog -->
  <div class="modal-overlay" id="confirmOverlay" hidden>
    <div class="modal confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <div class="modal-header">
        <h3 class="modal-title" id="confirmTitle">Confirmar exclusão</h3>
      </div>
      <div class="modal-body">
        <p id="confirmText"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="confirmCancel">Cancelar</button>
        <button class="btn btn-danger" id="confirmOk">Excluir</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/finances.js"></script>
  <script src="js/routine.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/workout.js"></script>
  <script src="js/diet.js"></script>
  <script src="js/goals.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
